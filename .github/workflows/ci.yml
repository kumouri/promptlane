name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Jam match smoke (mock model) + replay verify
        run: |
          npm run match -- --a prompts/pilots/drums.md --b prompts/pilots/keytar.md --model mock --seed 7 --out artifacts/ci-smoke.json --quiet
          npm run match -- --verify artifacts/ci-smoke.json
      - name: Arena unit + headless end-to-end (mock model)
        run: npm run test:arena
  fixture:
    name: Fixture protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s generation -p "test_*.py"
      - run: python -m unittest discover -s acceptance/tests -p "test_*.py"
      - run: python -m unittest discover -s tools -p "test_*.py"
